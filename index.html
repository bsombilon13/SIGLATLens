<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SIGLATLens Photobooth</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #050505;
      color: white;
      overflow: hidden;
    }
    .safe-area-bottom {
      padding-bottom: env(safe-area-inset-bottom);
    }
    /* Hide scrollbars */
    ::-webkit-scrollbar {
      display: none;
    }
    * {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .bg-theme-gradient {
      background: linear-gradient(135deg, #de4928 0%, #eb841e 100%);
    }
    
    .text-theme-gradient {
      background: linear-gradient(135deg, #de4928 0%, #eb841e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .shadow-theme {
      shadow-color: #de4928;
      box-shadow: 0 10px 25px -5px rgba(222, 73, 40, 0.3);
    }

    @keyframes zoomOutFade {
      from {
        opacity: 0;
        transform: scale(1.1);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    @keyframes pulseSubtle {
      0%, 100% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
      50% { opacity: 0.9; transform: translate(-50%, -50%) scale(1.02); }
    }

    .shimmer-placeholder {
      background: linear-gradient(90deg, #1a1a1a 25%, #2a2a2a 50%, #1a1a1a 75%);
      background-size: 200% 100%;
      animation: shimmer 2s infinite linear;
    }

    .animate-zoom-out {
      animation: zoomOutFade 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    .animate-pulse-subtle {
      animation: pulseSubtle 2s infinite ease-in-out;
    }

    .stagger-1 { animation-delay: 0.1s; }
    .stagger-2 { animation-delay: 0.2s; }
    .stagger-3 { animation-delay: 0.3s; }
    .stagger-4 { animation-delay: 0.4s; }

    /* Custom Color Picker Styling */
    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 0;
      height: 0;
      padding: 0;
      margin: 0;
      position: absolute;
      visibility: hidden;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
</body>
</html>
